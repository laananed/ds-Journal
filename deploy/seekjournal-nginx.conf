# SeekJournal dedicated Nginx instance; initially only on loopback.
user www-data;
worker_processes 1;
pid /run/seekjournal-nginx.pid;
error_log /var/log/nginx/seekjournal-error.log warn;
events { worker_connections 128; }
http {
    server_tokens off;
    access_log off;
    limit_req_zone $binary_remote_addr zone=seekjournal_demo:1m rate=60r/m;
    limit_req_status 429;
    server {
        listen 127.0.0.1:8443 ssl;
        server_name api.freirenlikesleep.cyou;
        ssl_certificate /etc/letsencrypt/live/api.freirenlikesleep.cyou/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.freirenlikesleep.cyou/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        auth_basic "SeekJournal demo";
        auth_basic_user_file /etc/seekjournal/htpasswd;
        add_header Access-Control-Allow-Origin "https://appassets.androidplatform.net" always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, If-Match" always;
        add_header Vary "Origin" always;
        add_header Cache-Control "no-store" always;
        location / {
            if ($request_method = OPTIONS) { return 204; }
            limit_req zone=seekjournal_demo burst=30 nodelay;
            proxy_set_header Authorization "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 300s;
            proxy_pass http://127.0.0.1:18090;
        }
    }
}
