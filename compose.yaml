# SeekJournal 本地开发数据库
#
# 只定义 PostgreSQL 单服务。
# 不容器化 Backend，不容器化 Frontend。
#
# 使用方式（在仓库根目录执行）：
#   docker compose --env-file backend/.env up -d postgres
#   docker compose --env-file backend/.env stop

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required, set it in backend/.env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required, set it in backend/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, set it in backend/.env}
    ports:
      # 只绑定本机回环地址，不对外暴露
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
