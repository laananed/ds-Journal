// Android 外壳工程：只有一个 app 模块。
// 依赖仓库只保留 google()/mavenCentral()，不引入其他依赖来源。
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = 'SeekJournalAndroid'
include ':app'
