# SeekJournal Android 外壳的单一构建配置来源（版本 + 云端 API 基址）。
# app/build.gradle 读取版本号；scripts/build-web.ps1 读取 apiBaseUrl 并注入前端构建。
# 修改本文件后重新执行 build-web.ps1 + gradlew assembleDebug 即可换地址。

seekjournal.versionCode=1
seekjournal.versionName=0.1.0-dev

# 云端基址约定（2026-11-03，用户暂定）：
#   形如 https://<演示域名>，【不含 /api 后缀】——前端各 src/api/*.ts 的请求路径
#   已经自带 "/api/..."（如 `${base}/api/journals`），基址再带 /api 会拼成 /api/api/。
#   域名尚未确定，下面仍是占位值（.invalid 为保留顶级域，永远不可解析）。
seekjournal.apiBaseUrl=https://api.seekjournal.invalid

# 该地址当前状态：placeholder。域名确定后替换上一行并重跑 build-web.ps1 + assembleDebug。
seekjournal.apiBaseUrlStatus=placeholder

# 认证候选：运行时由用户输入的 HTTP Basic（尚未实现、尚未定案）。
# 外壳不注入 Authorization 头、不存任何凭据；接线属于前端共享 API 层（src/api/*），
# 且需后端 CORS allow_headers 增加 Authorization。密码/AI 密钥一律不得写入本文件或 APK。
seekjournal.authMode=none
